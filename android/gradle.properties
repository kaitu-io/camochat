org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
kotlin.incremental=true
# Kotlin daemon 不给显式堆就按 JVM 默认起，在这台机器上和 Gradle daemon 抢内存时
# 起不来，报 "Could not connect to Kotlin compile daemon"——错误信息完全不提内存，
# 排查时极具误导性（2026-09-11 升 AGP 8.9 时连撞两次）。钉死堆大小即可。
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m
