# Robolectric 跑测试用的 Android 版本，和 App 的 targetSdk 是两个独立的旋钮。
# 不写这一行，Robolectric 就拿 manifest 里的 targetSdk（36）去建沙箱，而 SDK 36
# 的 android-all 要求 JDK 21 —— 于是「Play 要求 targetSdk 36」这件事会连锁把整条
# 工具链拖到 JDK 21，再撞上 Robolectric 在 JDK 21 下反射 FileDescriptor 失败。
#
# 这里的测试测的是我们自己的逻辑（ViewModel、加密接线、QR 位图编解码），不是框架
# 的版本差异行为，所以固定在一个稳定的沙箱版本上就够了。34 是这套测试一直跑绿的版本。
sdk=34
