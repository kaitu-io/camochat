# cargo-deny configuration. CI runs `cargo deny check licenses`: every crate in
# the dependency tree must carry a license compatible with AGPL-3.0-or-later.
[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # zbase32 (legacy text codec, see core/src/encoding/zbase32.rs) declares
  # "LGPL-3.0+"; LGPL-3.0-or-later is compatible with AGPL-3.0-or-later.
  "LGPL-3.0-or-later",
  "AGPL-3.0-or-later",
]
# The list is a policy, not an inventory: entries no crate uses yet are fine.
unused-allowed-license = "allow"
confidence-threshold = 0.9
