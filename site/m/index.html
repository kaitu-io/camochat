<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陈仓加密消息</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{
    --bg:#101214; --surface:#1A1D1F; --surface-2:#212528;
    --line:#26292C; --text:#EDEFF1; --muted:#A2A8AD;
    --jade:#3FAE8C; --jade-dim:#1E7A68; --gold:#D89A4A;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
    padding:40px 20px 48px;
  }
  .wrap{max-width:440px; margin:0 auto; text-align:center}
  .lock{margin-bottom:12px} .lock img{display:block; margin:0 auto}
  h1{font-size:21px; margin:0 0 12px; font-weight:800}
  p.sub{color:var(--muted); font-size:15px; margin:0 0 32px}
  ol.steps{list-style:none; margin:0 0 32px; padding:0; text-align:left; display:flex; flex-direction:column; gap:12px}
  ol.steps li{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; display:flex; gap:12px; align-items:flex-start; font-size:15px}
  ol.steps .n{flex:0 0 24px; height:24px; border-radius:50%; background:var(--jade); color:#06140f;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px}
  .platform-note{display:block; color:var(--muted); font-size:13px; margin-top:4px}
  .dl{display:flex; flex-direction:column; gap:12px; margin-bottom:24px}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 20px;
    border-radius:12px; font-weight:600; font-size:16px; border:1px solid transparent; text-decoration:none}
  .btn.primary{background:var(--jade); color:#06140f}
  .btn.primary:hover{background:#4cc29d}
  #wechat-tip{display:none; background:var(--surface); border:1px solid var(--gold); border-radius:12px;
    padding:16px; font-size:14px; color:var(--text); margin-bottom:24px}
  footer{margin-top:8px; font-size:13px; color:var(--muted)}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="lock"><img src="/favicon.svg" alt="CamoChat" width="64" height="64"></div>
  <h1>这是一条陈仓加密消息</h1>
  <p class="sub">内容已端到端加密，只有收件人的陈仓 App 能解开。服务器和微信都看不到。</p>

  <ol class="steps">
    <li><span class="n">1</span><span>在微信里双击这条消息</span></li>
    <li><span class="n">2</span><span>长按选中并全选</span></li>
    <li><span class="n">3</span><span>Android：选「陈仓解密」
      <span class="platform-note">iPhone：点「共享…」→「陈仓解密」</span>
    </span></li>
  </ol>

  <div class="dl" id="dl">
    <a class="btn primary" href="/dl/chencang-latest.apk" download>下载陈仓（Android APK）</a>
  </div>
  <div id="wechat-tip">点右上角 <strong>···</strong> 选择「在浏览器打开」后下载</div>

  <footer>中转服务器全部源码：<a href="/source">本站源码页</a></footer>
</div>
<script>
(function () {
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    document.getElementById('dl').style.display = 'none';
    document.getElementById('wechat-tip').style.display = 'block';
  }
})();
</script>
</body>
</html>
