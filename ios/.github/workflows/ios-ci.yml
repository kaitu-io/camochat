name: iOS CI

on:
  push:
    paths:
      - "ios/**"
      - "bindings/**"
      - "core/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "bindings/**"
      - "core/**"

jobs:
  shared-tests:
    name: ChencangShared swift test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build XCFramework
        run: cargo run -p xtask -- build-ios

      - name: Run ChencangShared unit tests
        run: swift test --parallel
        working-directory: ios/ChencangShared

  xcode-build:
    name: xcodebuild ChencangCompanion
    runs-on: macos-14
    needs: shared-tests
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build XCFramework
        run: cargo run -p xtask -- build-ios

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      - name: Build ChencangCompanion
        run: |
          set -o pipefail
          xcodebuild -project ChencangiOS.xcodeproj -scheme ChencangCompanion -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build | xcpretty --color || exit 1
        working-directory: ios
