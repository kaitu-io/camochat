[package]
name = "chencang-core"
version = "0.1.0-rc1"
edition = "2021"
rust-version = "1.75"
authors = ["CamoChat contributors"]
description = "CamoChat V1 protocol core — X3DH (classical suite) + symmetric ratchets, wire format, media blobs"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "chencang_core"

[dependencies]
# Symmetric crypto
chacha20poly1305 = "0.10"
# Classical asymmetric
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# Post-quantum (NIST FIPS 203/204)
ml-kem = "0.2"
ml-dsa = "=0.1.0-rc.11"
# Hashing + KDF
blake2 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# Password hashing
argon2 = "0.5"
# Encoding
zbase32 = "0.1"
hex = "0.4"
base64 = "0.21"
# Utilities
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"
thiserror = "1.0"
# Serialization (for wire + key storage)
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
# Deterministic integer-key CBOR for in-band pairing wire (single source of truth)
ciborium = "0.2"

[dev-dependencies]
proptest = "1.4"
hex-literal = "0.4"
serde_json = "1.0"
# Deterministic PRNG used by `tests/generate_golden_vectors.rs` so the
# committed vectors regenerate byte-identical from the same seed.
rand_chacha = "0.3"

[profile.release]
codegen-units = 1
lto = true
debug = false
panic = "abort"

[profile.dev]
opt-level = 1  # PQ crypto is slow at -O0
