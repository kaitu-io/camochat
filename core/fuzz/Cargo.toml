[package]
name = "chencang-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chencang-core = { path = ".." }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "parse_wire"
path = "fuzz_targets/parse_wire.rs"
test = false
doc = false
bench = false
