[package]
name = "chencang-bindings"
version = "0.1.0-rc1"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.75"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "chencang_bindings"

[dependencies]
chencang-core = { path = "../core" }
uniffi = { version = "0.31", features = ["cli"] }
rand = "0.8"
rand_core = "0.6"
thiserror = "1.0"
parking_lot = "0.12"
hex = "0.4"

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []

[[bench]]
name = "encrypt_throughput"
harness = false
